name: ccsa_smart_attendance
description: "CCSA Smart Attendance - Cross-Platform Dynamic Rotating QR Code Attendance System for Centre for Computer Science and Applications, Dibrugarh University."
publish_to: 'none'

version: 3.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI, Icons, Typography & Lottie Animation
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lucide_icons: ^0.257.0
  lottie: ^3.1.2

  # Dynamic QR Code Engine & Scanner
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  crypto: ^3.0.3

  # Multi-Platform Database (Mobile & Windows Desktop)
  sqflite: ^2.3.3+1
  sqflite_common_ffi: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3

  # Hardware Security, Device Binding & Biometrics
  device_info_plus: ^10.1.0
  local_auth: ^2.2.0

  # CSV & Forensic Export
  csv: ^6.0.0
  share_plus: ^9.0.0

  intl: ^0.19.0
  uuid: ^4.4.0
  collection: ^1.18.0
  http: ^1.2.1
  shared_preferences: ^2.2.3
  geolocator: ^12.0.0
  sqflite_common_ffi_web: ^0.4.3+1
  flutter_map: ^8.3.2
  latlong2: ^0.10.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  flutter_launcher_icons: ^0.14.4
  image: ^4.9.2

flutter:
  uses-material-design: true
  assets:
    - assets/images/

flutter_launcher_icons:
  image_path: "assets/icons/app_icon_main.png"
  android: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/app_icon_fg.png"
  min_sdk_android: 21
  windows:
    generate: true
    image_path: "assets/icons/app_icon_main.png"
    icon_size: 48
  web:
    generate: true
    image_path: "assets/icons/app_icon_main.png"
    background_color: "#FFFFFF"
    theme_color: "#0F2942"
